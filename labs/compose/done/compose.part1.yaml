# Part 1: the whole ShopKart stack in one file.
# Run from the repo root: docker compose -f labs/compose/done/compose.part1.yaml up -d --build
name: shopkart

services:
  web:
    image: nginx:1.30.7-alpine
    ports:
      - "8080:80"
    volumes:
      - ../../../app/web:/usr/share/nginx/html:ro
      - ../../../app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ../../../app/api
    image: shopkart-api:compose
    environment:
      DATABASE_URL: postgresql://shopkart:shopkart@db:5432/shopkart
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: shopkart
      POSTGRES_DB: shopkart
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../../app/api/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  redis:
    image: redis:8.8.4-alpine

volumes:
  db-data:
