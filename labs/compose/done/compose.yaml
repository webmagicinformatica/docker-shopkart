# Part 2: health checks, start order, restarts, a tools profile and `compose watch`.
# In this folder: `docker compose -f compose.yaml up -d --build --wait` (just this file)
#                 `docker compose up -d --build --wait` (this file + compose.override.yaml = dev mode)
name: shopkart

services:
  web:
    image: nginx:1.30.7-alpine
    ports:
      - "8080:80"
    volumes:
      - ../../../app/web:/usr/share/nginx/html:ro
      - ../../../app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../../../app/api
      args:
        APP_VERSION: "1.2"
    image: shopkart-api:compose
    environment:
      APP_ENV: compose
      DATABASE_URL: postgresql://shopkart:shopkart@db:5432/shopkart
      REDIS_URL: redis://redis:6379/0
    # No published port: only web talks to the API, so it can scale (--scale api=2)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The image already has a HEALTHCHECK; this makes it faster for local work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    # `docker compose watch`: copy code changes in and restart; rebuild when dependencies change
    develop:
      watch:
        - action: sync+restart
          path: ../../../app/api/shopkart_api
          target: /app/shopkart_api
        - action: rebuild
          path: ../../../app/api/requirements.txt

  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: shopkart
      POSTGRES_DB: shopkart
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../../app/api/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    restart: unless-stopped
    healthcheck:
      # -h 127.0.0.1: only true once the real server listens (not during first-time init)
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shopkart", "-d", "shopkart"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Only started with --profile tools
  psql:
    image: postgres:17.12-alpine
    profiles: [tools]
    environment:
      PGPASSWORD: shopkart
    entrypoint: ["psql", "-h", "db", "-U", "shopkart", "-d", "shopkart"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
