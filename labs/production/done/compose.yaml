# ShopKart with production habits: limits, restarts, health checks and log rotation.
#   docker compose -f labs/production/done/compose.yaml up -d --build --wait
name: shopkart-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"      # rotate each log at 10 MB...
    max-file: "3"        # ...and keep 3 files: at most 30 MB per container

services:
  web:
    image: nginx:1.30.7-alpine
    ports:
      - "8080:80"
    volumes:
      - ../../../app/web:/usr/share/nginx/html:ro
      - ../../../app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  api:
    build: ../../../app/api
    image: shopkart-api:prod
    environment:
      DATABASE_URL: postgresql://shopkart:shopkart@db:5432/shopkart
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: warning
    volumes:
      - ./recent.py:/app/shopkart_api/recent.py:ro     # the "recently viewed" module under test
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128m
          pids: 100

  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: shopkart
      POSTGRES_DB: shopkart
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../../app/api/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shopkart", "-d", "shopkart"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  db-data:
