# ShopKart pipeline (start): test -> build -> smoke test. Add the scan and the push.
# Copy to .github/workflows/pipeline.yml in your repo:
#   cp labs/ci-cd/start/pipeline.yml .github/workflows/pipeline.yml
name: Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io/<owner>/...

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt
      - name: Unit tests
        working-directory: app/api
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Image names and tags: sha-<commit> always, latest on main, 1.2.3 on a v1.2.3 tag
      - name: Tags for the API image
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shopkart-api
          tags: |
            type=sha,prefix=sha-,priority=850
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Tags for the web image
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shopkart-web
          tags: |
            type=sha,prefix=sha-,priority=850
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # 1. Build into the runner's Docker (not pushed yet), reusing layers from earlier runs
      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: app/api
          load: true
          tags: shopkart-api:candidate
          build-args: APP_VERSION=${{ steps.api-meta.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/web/Dockerfile
          load: true
          tags: shopkart-web:candidate
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # 2. Smoke test: does the image start and answer?
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 shopkart-api:candidate
          for i in $(seq 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/api/info
          docker rm -f api

      # 3. TODO: scan both images with ./labs/security/trivy.sh and FAIL on fixable HIGH/CRITICAL
      #    (--exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln)

      # 4. TODO: log in to ghcr.io with docker/login-action@v4 (username: github.actor,
      #    password: secrets.GITHUB_TOKEN), then push both images with docker/build-push-action@v7
      #    using the tags and labels from the metadata steps. Skip all of this for pull requests.

