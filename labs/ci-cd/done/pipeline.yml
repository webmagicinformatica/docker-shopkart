# ShopKart pipeline: test -> build -> smoke test -> scan -> push to GitHub Container Registry.
# Copy to .github/workflows/pipeline.yml in your repo:
#   cp labs/ci-cd/done/pipeline.yml .github/workflows/pipeline.yml
name: Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io/<owner>/...

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements-dev.txt
      - name: Unit tests
        working-directory: app/api
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Image names and tags: sha-<commit> always, latest on main, 1.2.3 on a v1.2.3 tag
      - name: Tags for the API image
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shopkart-api
          tags: |
            type=sha,prefix=sha-,priority=850
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Tags for the web image
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shopkart-web
          tags: |
            type=sha,prefix=sha-,priority=850
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # 1. Build into the runner's Docker (not pushed yet), reusing layers from earlier runs
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: app/api
          load: true
          tags: shopkart-api:candidate
          build-args: APP_VERSION=${{ steps.api-meta.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/web/Dockerfile
          load: true
          tags: shopkart-web:candidate
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # 2. Smoke test: does the image start and answer?
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 shopkart-api:candidate
          for i in $(seq 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/api/info
          docker rm -f api

      # 3. Scan: fail the pipeline on fixable HIGH or CRITICAL vulnerabilities
      - name: Scan with Trivy
        run: |
          for image in shopkart-api:candidate shopkart-web:candidate; do
            echo "Scanning $image"
            ./labs/security/trivy.sh image --quiet --exit-code 1 --ignore-unfixed \
              --severity HIGH,CRITICAL --scanners vuln "$image"
          done

      # 4. Push (not for pull requests). Same Dockerfile + cache, so this is fast.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push API
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app/api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.api-meta.outputs.version }}
          cache-from: type=gha,scope=api
      - name: Push web
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/web/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.api-meta.outputs.tags }}' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.web-meta.outputs.tags }}' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
