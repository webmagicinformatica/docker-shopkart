<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopKart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shop<span>Kart</span></h1>
    <p id="status">Connecting to the API…</p>
  </header>
  <p id="banner" hidden></p>
  <main>
    <section>
      <h2>Products</h2>
      <ul id="products" class="grid"></ul>
    </section>
    <aside>
      <h2>Your cart</h2>
      <ul id="cart"></ul>
      <p class="total">Total: <strong id="total">₹0</strong></p>
      <button id="clear" type="button">Empty cart</button>
    </aside>
  </main>
  <footer id="info"></footer>
  <script src="app.js"></script>
</body>
</html>
